[package]
name = "asteria-corpus"
description = "Asteria IME: コーパス・連語・語彙・評価セット生成パイプライン"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
asteria-common = { path = "../asteria-common" }
bzip2 = "0.5"
csv = "1"
flate2 = "1"
quick-xml = "0.37"
rand = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sudachi = { package = "suiko-sudachi", version = "0.7" }
tempfile = "3"
unicode-normalization = "0.1.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
