[package]
name = "asteria-assets"
description = "Asteria IME: アイコン・インストーラ素材・README図版・Win32ウィンドウ撮影"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
csv = "1"
ico = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["png", "bmp", "ico"] }
serde_json = "1"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
