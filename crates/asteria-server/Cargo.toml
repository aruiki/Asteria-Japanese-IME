[package]
name = "asteria-server"
description = "Asteria IME: エンジン本体(4章)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
asteria-composer = { path = "../asteria-composer" }
asteria-dict = { path = "../asteria-dict" }
asteria-lattice = { path = "../asteria-lattice" }
asteria-learn = { path = "../asteria-learn" }
asteria-lm = { path = "../asteria-lm" }
asteria-predict = { path = "../asteria-predict" }
asteria-proto = { path = "../asteria-proto" }
asteria-session = { path = "../asteria-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
asteria-client = { path = "../asteria-client" }

[target.'cfg(windows)'.dependencies]
asteria-client = { path = "../asteria-client" }

[target."cfg(unix)".dependencies]
fs4 = { version = "1.1.0", features = ["sync"] }
