[package]
name = "asteria-config"
description = "Asteria IME: 設定GUI(12章)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
asteria-client = { path = "../asteria-client" }
asteria-common = { path = "../asteria-common" }
asteria-learn = { path = "../asteria-learn" }
asteria-lm = { path = "../asteria-lm" }
asteria-proto = { path = "../asteria-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
