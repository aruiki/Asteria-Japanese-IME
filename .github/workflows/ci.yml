name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # テストのハングを数時間放置しない。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(asteria-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci

  licenses:
    # 依存のライセンスが about.toml で認めたものだけか(REQ-16-1、REQ-16-2)。
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --workspace --locked about.hbs -o /dev/null

  asteria-tools:
    # Rust 版 CLI・評価・配布ツールの検証。MSI のビルドは mozc-windows.yml。
    name: asteria-tools (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p asteria-common -p asteria-release -p asteria-corpus -p asteria-eval -p asteria-assets -p asteria-cli
      - run: cargo run --locked --bin asteria-tools -- --help
      - run: cargo run --locked --bin asteria-tools -- regression-add --check
      - run: cargo run --locked --bin asteria-tools -- release-name --tag v0.1.0-beta.1 --date 2026-10-19

  msrv:
    name: MSRV (1.80)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(asteria-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  windows-tip:
    # Rust 製 TSF TIP(asteria-tip-win)。x64 と x86 の両方を作り、単体テストと登録・解除を確かめる(REQ-10-1、docs/adr/0009)。
    name: TSF TIP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: Win32
            target: i686-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # DLL の静的な VC ランタイム(/MT)に合わせる。
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          # インストールの確認で作るサーバー/設定GUIが asteria-lm(third_party/llama.cpp)を使う
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tip-${{ matrix.target }}
      - run: cargo build -p asteria-tip-win --release --locked --target ${{ matrix.target }}
      - run: cargo test -p asteria-tip-win --locked --target ${{ matrix.target }}
      - run: ./frontends/windows/tests/register.ps1 -Dll target/${{ matrix.target }}/release/asteria_tip.dll -Arch ${{ matrix.arch }}
        shell: pwsh
      # インストールとアンインストールのスクリプト(16.2)。x64 だけで確かめる。
      - if: matrix.arch == 'x64'
        run: cargo build -p asteria-server -p asteria-renderer -p asteria-config --release --locked --target ${{ matrix.target }}
      - if: matrix.arch == 'x64'
        run: ./frontends/windows/tests/install.ps1 -Server target/${{ matrix.target }}/release/asteria-server.exe -Renderer target/${{ matrix.target }}/release/asteria-renderer.exe -Config target/${{ matrix.target }}/release/asteria-config.exe -Dll target/${{ matrix.target }}/release/asteria_tip.dll
        shell: pwsh
